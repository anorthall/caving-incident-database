name: Deploy Backend

on:
  push:
    branches:
      - main
    paths-ignore:
      - "frontend/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (defaults to the current commit)"
        required: false
        type: string

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  backend-tests:
    name: Backend Tests
    uses: ./.github/workflows/backend-tests.yaml

  lint:
    name: Lint
    uses: ./.github/workflows/lint.yaml

  infra:
    name: Infra Checks
    uses: ./.github/workflows/infra-checks.yaml

  image:
    name: Image
    uses: ./.github/workflows/image.yaml
    with:
      push: true
      ref: ${{ inputs.sha || github.sha }}

  deploy:
    name: Deploy
    needs: [backend-tests, lint, infra, image]
    if: vars.EC2_INSTANCE_ID != ''
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2

      - name: Run deploy.sh via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOY_SHA: ${{ needs.image.outputs.sha }}
        run: |
          set -euo pipefail

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${DEPLOY_SHA:0:7}" \
            --parameters "commands=[\"/opt/cidb/deploy.sh $DEPLOY_SHA\"]" \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"

          status=Pending
          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          echo "::group::deploy.sh stdout"
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "::endgroup::"

          echo "::group::deploy.sh stderr"
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text
          echo "::endgroup::"

          echo "final status: $status"
          [ "$status" = "Success" ]
